<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трамвай на фоне панорамы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Контейнер сцены с фоном-панорамой */
        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: url('panorama.png') no-repeat center center;
            background-size: cover;
            overflow: hidden;
        }

        /* Рельсы / дорога внизу экрана */
        .tracks {
            position: absolute;
            bottom: 40px;
            width: 100%;
            height: 6px;
            background: #2c3e50;
            border-top: 2px solid #7f8c8d;
        }

        /* Сам трамвай */
        .tram {
            position: absolute;
            bottom: 46px;
            left: -220px;
            width: 200px;
            height: 80px;
            background: #e74c3c; /* Красный цвет трамвая */
            border-radius: 12px 12px 2px 2px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            animation: drive 12s linear infinite;
        }

        /* Окна трамвая */
        .tram-windows {
            display: flex;
            justify-content: space-around;
            padding: 12px 10px 0 10px;
        }

        .window {
            width: 35px;
            height: 40px;
            background: #aed6f1;
            border-radius: 4px;
            border: 2px solid #c0392b;
        }

        /* Фара */
        .headlight {
            position: absolute;
            right: -5px;
            bottom: 10px;
            width: 10px;
            height: 15px;
            background: #f1c40f;
            border-radius: 50%;
            box-shadow: 0 0 10px #f1c40f;
        }

        /* Колеса трамвая */
        .wheel {
            position: absolute;
            bottom: -12px;
            width: 26px;
            height: 26px;
            background: #34495e;
            border-radius: 50%;
            border: 4px solid #bdc3c7;
        }

        .wheel-left { left: 25px; }
        .wheel-right { right: 25px; }

        /* Анимация движения слева направо */
        @keyframes drive {
            0% {
                transform: translateX(-250px);
            }
            100% {
                transform: translateX(calc(100vw + 250px));
            }
        }
    </style>
</head>
<body>

    <div class="scene">
        <!-- Рельсы -->
        <div class="tracks"></div>

        <!-- Трамвай -->
        <div class="tram">
            <div class="tram-windows">
                <div class="window"></div>
                <div class="window"></div>
                <div class="window"></div>
            </div>
            <div class="headlight"></div>
            <div class="wheel wheel-left"></div>
            <div class="wheel wheel-right"></div>
        </div>
    </div>

</body>
</html>
